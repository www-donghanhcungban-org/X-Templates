name: CodeQL

# SAST cho mã Python của công cụ khung (scripts/, tests/) + quét định kỳ hằng tuần.
# Dự án thật cài khung nên có workflow CodeQL riêng theo ngôn ngữ của mình (12-security/appsec-web).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # CodeQL quét Python. Thay đổi ngoài phạm vi vẫn được quét khi vào main và theo lịch tuần.
    paths:
      - '*.py'
      - '**/*.py'
      - '*.pyi'
      - '**/*.pyi'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job không push (AUD-CI-007)
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"
