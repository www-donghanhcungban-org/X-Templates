name: Diagnostic main Python 3.13 shard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: diagnostic-py313 ${{ matrix.sample }}
    if: github.ref == 'refs/heads/perf/py313-runner-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: instrumentation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 614cbe3ec7eb6b691b67df25e87c0de1b6bc539c
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.18'
          cache: pip
          cache-dependency-path: source/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --quiet --require-hashes -r source/requirements-dev.txt
      - name: Profile fixed test shard
        env:
          XT_MIN_TESTS: '100'
        run: |
          set -euo pipefail
          if [[ "${{ matrix.sample }}" == "1" ]]; then
            python instrumentation/diagnostics/recheck_main.py source result baseline current
          else
            python instrumentation/diagnostics/recheck_main.py source result current baseline
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: py313-profile-${{ matrix.sample }}
          path: result/
          if-no-files-found: error
          retention-days: 7
